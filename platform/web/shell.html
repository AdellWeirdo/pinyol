<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>np2d</title>
<style>
  :root { --bg: #11161a; --ink: #e8dcc2; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  main { min-height: 100%; display: grid; place-items: center; gap: 12px; padding: 16px; box-sizing: border-box; }
  /* the game draws 480x320; the canvas keeps that ratio and whole pixels look crisp at any size */
  canvas { width: min(960px, 100%); aspect-ratio: 3 / 2; image-rendering: pixelated; background: #000; outline: none; }
  p { margin: 0; opacity: .7; text-align: center; }
</style>
</head>
<body>
<main>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()" aria-label="Juego"></canvas>
  <p id="status">Cargando…</p>
  <p>Flechas/WASD mover · Enter A · Esc B · Tab C · I bolsa · P pausa · ratón = táctil</p>
</main>
<script>
  const status = document.getElementById('status');
  var Module = {
    canvas: document.getElementById('canvas'),
    setStatus: t => { status.textContent = t || ''; },
    onRuntimeInitialized: () => document.getElementById('canvas').focus(),
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
