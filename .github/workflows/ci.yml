# Every push and pull request: the engine built with its sanitizers, and every test (ctest): the examples validated
# and played by their scripts, the tools that make games, the web editor's templates.
name: tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libsdl2-dev
          python3 -m pip install --user pillow fonttools
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # the editor reads navigator, a global since Node 21
      - name: Build
        run: cmake -B build && cmake --build build -j4
      - name: Test
        run: ctest --test-dir build -j4 --output-on-failure
