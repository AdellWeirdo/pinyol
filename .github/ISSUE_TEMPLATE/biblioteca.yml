name: Subir un juego a la Biblioteca
description: Tu juego hecho con pinyol, en la Biblioteca de la web, para jugarlo en el navegador y descargarlo para la consola.
title: "Biblioteca: "
labels: [biblioteca]
body:
  - type: markdown
    attributes:
      value: |
        Un robot comprobará tu juego (lo abre, lo juega diez segundos y saca su portada) y te contestará aquí. Si todo va bien, lo revisamos y aparece en https://pinyol.ipaud.dev/#biblioteca.
        El .zip es el de `python3 tools/pack_game.py games/<id>`, el del editor («Guardar archivo») o tu carpeta del juego comprimida. Máximo 48 MB (96 MB descomprimido, 4000 archivos).
        A la consola, un juego de más de 32 MB descomprimido se copia por la tarjeta SD: el cable llega a 32 MB.
        ¿Una versión nueva de un juego que ya está en la Biblioteca? Envía este formulario otra vez, con el mismo id en `game.json` y desde la misma cuenta de GitHub: al aprobarlo sustituye al anterior.
        ¿Ves en la Biblioteca algo tuyo publicado sin tu permiso, o algo que no debería estar? [Abre un issue](https://github.com/ipaud/pinyol/issues/new?title=Retirar%3A%20) contándolo y lo retiramos.
  - type: input
    id: titulo
    attributes:
      label: Título
      description: Como quieres que salga en la Biblioteca (máximo 48 caracteres).
    validations:
      required: true
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      description: Una o dos frases. Cómo se juega, qué tiene de especial.
    validations:
      required: true
  - type: textarea
    id: zip
    attributes:
      label: El juego (.zip)
      description: Arrastra aquí el .zip de tu juego (GitHub adjunta hasta 25 MB). Si pesa más, súbelo como archivo de una
        Release de tu repositorio y pega aquí su enlace de descarga (https://github.com/tú/repo/releases/download/…/juego.zip).
    validations:
      required: true
  - type: dropdown
    id: licencia
    attributes:
      label: Licencia
      description: Con qué licencia lo publicas. CC0 es dominio público; CC BY 4.0 pide que te citen; MIT es la del código del motor.
      options: ["CC0", "CC BY 4.0", "MIT"]
    validations:
      required: true
  - type: checkboxes
    id: permisos
    attributes:
      label: Permisos
      options:
        - label: El juego es mío, o tengo permiso de quien hizo cada parte (código, dibujos, música).
          required: true
        - label: Acepto que se publique en la Biblioteca con la licencia que he elegido.
          required: true
        - label: Tengo 14 años o más, o permiso de mi madre, padre o tutor para publicarlo.
          required: true
